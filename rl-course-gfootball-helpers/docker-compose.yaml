version: '3.8'

services:
  gfootball:
    build:
      context: ../football  # Build context is the football folder
      dockerfile: Dockerfile  # Dockerfile path relative to context
      args:
        UID: ${UID}
        GID: ${GID}
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY}
    image: gfootball:latest
    container_name: gfootball-dev
    user: "${UID:-1000}:${GID:-1000}"
    # Add any volumes, ports, environment variables, etc. as needed
    command: sleep infinity  # Mantém o container rodando indefinidamente

    # ports:
    #   - "6006:6006"  # Example: TensorBoard port
    # environment:
    #   - DISPLAY=${DISPLAY}
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    develop:
      watch:
        - action: sync
          path: ./football
          target: /gfootball/gfootball
          ignore:
            - __pycache__/
            - "*.pyc"

        - action: rebuild
          path: ./setup.py
          
        - action: rebuild
          path: ./requirements.txt
          
        - action: rebuild
          path: ./Dockerfile